[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signalstory"
version = "0.1.0"
description = "Composable signal-to-story generation for evidence-grounded narratives."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "SignalStory contributors" }]

[tool.setuptools.packages.find]
where = ["."]
