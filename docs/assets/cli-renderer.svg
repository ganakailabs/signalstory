<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500" role="img" aria-labelledby="title desc">
  <title id="title">CLI renderer example</title>
  <desc id="desc">A terminal screenshot showing ANSI formatted SignalStory output.</desc>
  <rect width="980" height="500" rx="18" fill="#0f172a"/>
  <rect x="36" y="34" width="908" height="432" rx="16" fill="#111827" stroke="#334155"/>
  <circle cx="70" cy="64" r="7" fill="#ef4444"/>
  <circle cx="94" cy="64" r="7" fill="#f59e0b"/>
  <circle cx="118" cy="64" r="7" fill="#22c55e"/>
  <text x="70" y="116" font-family="Menlo, Consolas, monospace" font-size="16" fill="#94a3b8">$ signalstory render --format ansi</text>
  <text x="70" y="168" font-family="Menlo, Consolas, monospace" font-size="20" fill="#fbbf24">Alert triangle <tspan font-weight="700" fill="#ffffff">Failure rate</tspan><tspan fill="#e5e7eb"> is </tspan><tspan font-weight="700" fill="#ffffff">7.3%</tspan><tspan fill="#e5e7eb">, above the expected threshold.</tspan></text>
  <text x="70" y="220" font-family="Menlo, Consolas, monospace" font-size="16" fill="#94a3b8">Why it matters</text>
  <text x="70" y="250" font-family="Menlo, Consolas, monospace" font-size="16" fill="#cbd5e1">Recent evidence shows elevated user-visible failures.</text>
  <text x="70" y="306" font-family="Menlo, Consolas, monospace" font-size="16" fill="#94a3b8">Evidence</text>
  <text x="70" y="336" font-family="Menlo, Consolas, monospace" font-size="16" fill="#cbd5e1">- Failure rate: 7.3%</text>
  <text x="70" y="392" font-family="Menlo, Consolas, monospace" font-size="16" fill="#94a3b8">Recommended action</text>
  <text x="70" y="422" font-family="Menlo, Consolas, monospace" font-size="16" fill="#cbd5e1">Review the latest failing checks.</text>
</svg>
