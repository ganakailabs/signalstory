<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500" role="img" aria-labelledby="title desc">
  <title id="title">Markdown renderer example</title>
  <desc id="desc">A GitHub-style Markdown comment rendered from a SignalStory story.</desc>
  <rect width="980" height="500" rx="18" fill="#f6f8fa"/>
  <rect x="42" y="34" width="896" height="432" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="42" y="34" width="896" height="54" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="70" y="68" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#24292f">SignalStory summary</text>
  <text x="70" y="132" font-family="Inter, Arial, sans-serif" font-size="18" fill="#24292f">alert-triangle <tspan font-weight="700">Failure rate</tspan><tspan> is </tspan><tspan font-weight="700">7.3%</tspan><tspan>, above the expected threshold.</tspan></text>
  <line x1="70" y1="166" x2="890" y2="166" stroke="#d8dee4"/>
  <text x="70" y="214" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#24292f">Why it matters:</text>
  <text x="205" y="214" font-family="Inter, Arial, sans-serif" font-size="17" fill="#24292f">Recent evidence shows elevated user-visible failures.</text>
  <text x="70" y="270" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#24292f">Recommended action:</text>
  <text x="245" y="270" font-family="Inter, Arial, sans-serif" font-size="17" fill="#24292f">Review the latest failing checks.</text>
  <text x="70" y="326" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#24292f">Evidence:</text>
  <circle cx="84" cy="362" r="3" fill="#24292f"/>
  <text x="100" y="368" font-family="Inter, Arial, sans-serif" font-size="17" fill="#24292f">Failure rate: 7.3%</text>
  <rect x="70" y="398" width="154" height="34" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="92" y="421" font-family="Inter, Arial, sans-serif" font-size="14" fill="#57606a">GitHub-safe Markdown</text>
</svg>
